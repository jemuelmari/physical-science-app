<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="Physical Science">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b7a3d"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4a300"/>
      <stop offset="100%" stop-color="#ff7043"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect x="0" y="0" width="192" height="192" rx="42" ry="42" fill="url(#bg)"/>

  <!-- Atom rings -->
  <g transform="translate(96,96)" fill="none" stroke="#ffffff" stroke-width="5" opacity="0.95">
    <ellipse cx="0" cy="0" rx="62" ry="22" transform="rotate(0)"/>
    <ellipse cx="0" cy="0" rx="62" ry="22" transform="rotate(60)"/>
    <ellipse cx="0" cy="0" rx="62" ry="22" transform="rotate(-60)"/>
  </g>

  <!-- Nucleus -->
  <circle cx="96" cy="96" r="16" fill="url(#orb)"/>
  <circle cx="96" cy="96" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Electrons -->
  <circle cx="158" cy="96" r="6" fill="#ffffff"/>
  <circle cx="65"  cy="130" r="6" fill="#ffffff"/>
  <circle cx="65"  cy="62"  r="6" fill="#ffffff"/>

  <!-- Sparkle (top-right) -->
  <g transform="translate(160,40)" fill="#ffffff" opacity="0.9">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
  </g>
</svg>
