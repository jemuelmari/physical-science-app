<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync Center · Teacher</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/teacher.css" />
  <link rel="stylesheet" href="../assets/css/classrecord.css" />
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>🔄 Sync Center</h1>
        <span class="version">Physical Science · Teacher</span>
      </div>
      <div class="header-actions">
        <a href="../instructor.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Hub</a>
        <button class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;" data-action="logout-teacher">⏻ Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:1100px;">

    <!-- CODE REDEEMER -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header">
        <div class="card-title">🔑 Redeem Student Sync Code</div>
      </div>
      <p class="text-muted text-small">
        Ask your student for their 6-character sync code. Enter it below to instantly
        load their complete record.
      </p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;">
        <input type="text" id="redeem-code-input" class="form-control"
               placeholder="JX3K9P" maxlength="8"
               style="max-width:200px;text-transform:uppercase;font-family:monospace;font-size:1.2rem;font-weight:800;letter-spacing:4px;text-align:center;" />
        <button id="btn-redeem" class="btn btn-primary">🔍 Load Student</button>
        <button id="btn-live-refresh" class="btn btn-outline">🔄 Live Refresh (30s)</button>
      </div>
      <div id="redeem-result" style="margin-top:16px;"></div>
    </div>

    <!-- LIVE STATUS -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card-header">
        <div class="card-title">📡 Live Sync Status</div>
        <span id="live-status" class="text-muted text-small">Not started</span>
      </div>
      <div id="live-stats"></div>
    </div>

    <!-- MANUAL SYNC -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">⚡ Manual Sync</div>
        <button id="btn-ping" class="btn btn-outline">Ping Backend</button>
      </div>
      <div id="backend-status"><div class="empty-state">Click "Ping Backend" to check status.</div></div>
    </div>

  </main>

  <footer class="app-footer"><p>Sync Center · v2.0.0</p></footer>

  <script src="../config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/security.js"></script>
  <script src="../assets/js/sync.js"></script>
  <script src="../assets/js/ui-helpers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.requireTeacher();

      const input = document.getElementById('redeem-code-input');
      const btnRedeem = document.getElementById('btn-redeem');
      const btnRefresh = document.getElementById('btn-live-refresh');
      const resultEl = document.getElementById('redeem-result');
      const statusEl = document.getElementById('live-status');
      const statsEl = document.getElementById('live-stats');
      const backendStatus = document.getElementById('backend-status');

      // ---- Redeem code ----
      btnRedeem.addEventListener('click', async () => {
        const code = input.value.trim().toUpperCase();
        if (code.length < 4) { alert('Please enter a valid code.'); return; }

        btnRedeem.disabled = true;
        btnRedeem.textContent = '⏳ Looking up…';
        resultEl.innerHTML = '<div class="alert alert-info">Searching…</div>';

        try {
          const res = await Sync.redeemCode(code);
          if (!res || !res.ok) throw new Error(res && res.error ? res.error : 'Not found');
          renderStudentResult(res);
        } catch (e) {
          resultEl.innerHTML = `<div class="alert alert-danger">❌ ${e.message}</div>`;
        } finally {
          btnRedeem.disabled = false;
          btnRedeem.textContent = '🔍 Load Student';
        }
      });

      function renderStudentResult(res) {
        const s = res.student || {};
        const records = res.records || [];
        const activities = res.activities || [];

        const avg = records.length
          ? Math.round(records.reduce((sum, r) => sum + (Number(r.FinalGrade) || 0), 0) / records.length)
          : 0;

        resultEl.innerHTML = `
          <div class="alert alert-success">
            ✅ Loaded: <strong>${escapeHtml(s.LastName || '?')}, ${escapeHtml(s.FirstName || '?')}</strong>
            · LRN ${escapeHtml(s.LRN || res.lrn)}
            · Grade ${escapeHtml(s.GradeLevel || '?')} · ${escapeHtml(s.Section || '?')}
          </div>
          <div class="cr-stats-grid" style="margin-top:12px;">
            <div class="cr-stat-card blue"><div class="cs-icon">📝</div><div class="cs-value">${records.length}</div><div class="cs-label">Assessments</div></div>
            <div class="cr-stat-card"><div class="cs-icon">📊</div><div class="cs-value">${activities.length}</div><div class="cs-label">Activities</div></div>
            <div class="cr-stat-card ${avg >= 75 ? 'green' : 'red'}"><div class="cs-icon">🎯</div><div class="cs-value">${avg || '—'}</div><div class="cs-label">Avg Grade</div></div>
          </div>
          <div class="modern-table-wrap" style="margin-top:12px;max-height:300px;overflow:auto;">
            <table class="modern-table">
              <thead><tr><th>Assessment</th><th>Score</th><th>%</th><th>Grade</th><th>Date</th></tr></thead>
              <tbody>
                ${records.map(r => `
                  <tr>
                    <td>${escapeHtml(r.AssessmentId)}</td>
                    <td>${r.Score} / ${r.Total}</td>
                    <td>${r.Percent}%</td>
                    <td>${r.FinalGrade}</td>
                    <td>${new Date(r.Timestamp).toLocaleString()}</td>
                  </tr>
                `).join('') || '<tr><td colspan="5" class="text-muted" style="padding:16px;text-align:center;">No records yet.</td></tr>'}
              </tbody>
            </table>
          </div>
        `;
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str).replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      // ---- Live refresh ----
      let refreshTimer = null;

      function startLiveRefresh() {
        if (refreshTimer) return;
        refresh();
        refreshTimer = setInterval(refresh, 30000);
        btnRefresh.textContent = '⏹ Stop Live Refresh';
        statusEl.textContent = '● Live (30s)';
        statusEl.style.color = '#2e7d32';
        statusEl.style.fontWeight = '700';
      }

      function stopLiveRefresh() {
        if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
        btnRefresh.textContent = '🔄 Live Refresh (30s)';
        statusEl.textContent = 'Stopped';
        statusEl.style.color = '#90a4ae';
        statusEl.style.fontWeight = '400';
      }

      btnRefresh.addEventListener('click', () => {
        if (refreshTimer) stopLiveRefresh();
        else startLiveRefresh();
      });

      async function refresh() {
        try {
          const data = await Sync.fetchAll();
          const students = data.students || [];
          const records = data.records || [];
          const activities = data.activities || [];

          statsEl.innerHTML = `
            <div class="cr-stats-grid">
              <div class="cr-stat-card blue"><div class="cs-icon">👥</div><div class="cs-value">${students.length}</div><div class="cs-label">Students</div></div>
              <div class="cr-stat-card"><div class="cs-icon">📝</div><div class="cs-value">${records.length}</div><div class="cs-label">Records</div></div>
              <div class="cr-stat-card"><div class="cs-icon">📊</div><div class="cs-value">${activities.length}</div><div class="cs-label">Activities</div></div>
              <div class="cr-stat-card green"><div class="cs-icon">🕒</div><div class="cs-value" style="font-size:0.9rem;">${new Date().toLocaleTimeString()}</div><div class="cs-label">Last Updated</div></div>
            </div>
          `;
        } catch (e) {
          statusEl.textContent = '⚠ Error: ' + e.message;
          statusEl.style.color = '#c62828';
        }
      }

      // ---- Ping ----
      document.getElementById('btn-ping').addEventListener('click', async () => {
        backendStatus.innerHTML = `<div class="alert alert-info">Pinging…</div>`;
        const res = await Sync.ping();
        if (res && res.ok) {
          backendStatus.innerHTML = `<div class="alert alert-success">
            ✅ Backend online · <strong>${escapeHtml(res.service || 'Unknown')}</strong> ·
            v${escapeHtml(res.version || '?')} · ${new Date(res.timestamp).toLocaleString()}
          </div>`;
        } else {
          backendStatus.innerHTML = `<div class="alert alert-danger">
            ❌ Backend not reachable: ${escapeHtml((res && res.error) || 'Unknown error')}
          </div>`;
        }
      });

      // Auto-start live refresh
      startLiveRefresh();
    });
  </script>
</body>
</html>
