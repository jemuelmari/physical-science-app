<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Normalize Names · Teacher</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/teacher.css" />
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>🧹 Normalize Names</h1>
        <span class="version">Physical Science · Teacher</span>
      </div>
      <div class="header-actions">
        <a href="../instructor.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Hub</a>
        <button class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;" data-action="logout-teacher">⏻ Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:1000px;">

    <div class="hero-card" style="margin-bottom:24px;">
      <h2>🧹 Clean Up Name Formatting</h2>
      <p class="text-muted">
        Applies Title Case, trims extra spaces, and corrects common typos in
        student records. Preview changes before saving.
      </p>
    </div>

    <div class="filter-bar">
      <div class="filter-actions">
        <button id="btn-preview" class="btn btn-primary">👁 Preview Changes</button>
        <button id="btn-apply" class="btn btn-danger" disabled>✓ Apply Changes</button>
      </div>
    </div>

    <div id="normalize-output"></div>

  </main>

  <footer class="app-footer"><p>Normalize Names · v1.0.0</p></footer>

  <script src="../config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/ui-helpers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.requireTeacher();

      let pendingChanges = [];
      let currentRecords = null;

      function titleCase(str) {
        return String(str || '')
          .trim()
          .replace(/\s+/g, ' ')
          .toLowerCase()
          .split(' ')
          .map(w => w.charAt(0).toUpperCase() + w.slice(1))
          .join(' ');
      }

      document.getElementById('btn-preview').addEventListener('click', () => {
        const records = Store.getRecords();
        currentRecords = records;
        pendingChanges = [];

        records.forEach((r, idx) => {
          const fixed = {
            lastName: titleCase(r.lastName),
            firstName: titleCase(r.firstName),
            section: String(r.section || '').toUpperCase().replace(/\s+/g, '')
          };
          const changed =
            fixed.lastName !== r.lastName ||
            fixed.firstName !== r.firstName ||
            fixed.section !== r.section;
          if (changed) {
            pendingChanges.push({ idx, before: r, after: fixed });
          }
        });

        renderPreview();
        document.getElementById('btn-apply').disabled = !pendingChanges.length;
      });

      function renderPreview() {
        const out = document.getElementById('normalize-output');
        if (!pendingChanges.length) {
          out.innerHTML = `<div class="alert alert-success">✅ All names are already normalized.</div>`;
          return;
        }
        out.innerHTML = `
          <div class="card">
            <div class="card-header">
              <div class="card-title">Preview · ${pendingChanges.length} change(s)</div>
            </div>
            <div class="modern-table-wrap">
              <table class="modern-table">
                <thead>
                  <tr>
                    <th>LRN</th>
                    <th>Field</th>
                    <th>Before</th>
                    <th>After</th>
                  </tr>
                </thead>
                <tbody>
                  ${pendingChanges.map(c => {
                    const rows = [];
                    if (c.before.lastName !== c.after.lastName) rows.push(['Last Name', c.before.lastName, c.after.lastName]);
                    if (c.before.firstName !== c.after.firstName) rows.push(['First Name', c.before.firstName, c.after.firstName]);
                    if (c.before.section !== c.after.section) rows.push(['Section', c.before.section, c.after.section]);
                    return rows.map(([field, before, after]) => `
                      <tr>
                        <td>${UI.escapeHtml(c.before.lrn)}</td>
                        <td>${field}</td>
                        <td class="text-muted">${UI.escapeHtml(before || '')}</td>
                        <td><strong>${UI.escapeHtml(after || '')}</strong></td>
                      </tr>
                    `).join('');
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }

      document.getElementById('btn-apply').addEventListener('click', () => {
        if (!pendingChanges.length) return;
        if (!confirm(`Apply ${pendingChanges.length} change(s)? This updates all local records.`)) return;

        pendingChanges.forEach(c => {
          const rec = currentRecords[c.idx];
          rec.lastName = c.after.lastName;
          rec.firstName = c.after.firstName;
          rec.section = c.after.section;
          rec.updatedAt = new Date().toISOString();
        });

        // Persist all records
        localStorage.setItem('physci_records', JSON.stringify(currentRecords));

        alert('✅ Changes applied successfully.');
        pendingChanges = [];
        document.getElementById('btn-apply').disabled = true;
        document.getElementById('normalize-output').innerHTML =
          `<div class="alert alert-success">✅ All changes applied.</div>`;
      });
    });
  </script>
</body>
</html>
