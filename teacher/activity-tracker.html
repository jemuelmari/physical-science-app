<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Tracker · Teacher</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/teacher.css" />
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>📡 Activity Tracker</h1>
        <span class="version">Physical Science · Teacher</span>
      </div>
      <div class="header-actions">
        <a href="../instructor.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Hub</a>
        <button class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;" data-action="logout-teacher">⏻ Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:1100px;">

    <div class="filter-bar">
      <div class="filter-group">
        <label>Action</label>
        <select id="filter-action">
          <option value="">— All —</option>
          <option value="student_login">Student Login</option>
          <option value="lesson_view">Lesson View</option>
          <option value="day_complete">Day Complete</option>
          <option value="assessment_start">Assessment Start</option>
          <option value="assessment_submit">Assessment Submit</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Student</label>
        <select id="filter-student">
          <option value="">— All Students —</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Search</label>
        <input type="text" id="filter-lrn" placeholder="Name or LRN…" />
      </div>
      <div class="filter-actions">
        <button id="btn-refresh" class="btn btn-primary">🔄 Sync Now</button>
        <button id="btn-clear" class="btn btn-danger">🗑 Clear Local</button>
      </div>
    </div>

    <div class="cr-stats-grid" id="stats"></div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Recent Events</div>
        <span id="event-count" class="text-muted text-small">—</span>
      </div>
      <div id="events-table"></div>
    </div>

  </main>

  <footer class="app-footer"><p>Activity Tracker · v1.1.0</p></footer>

  <script src="../config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/activity-tracker.js"></script>
  <script src="../assets/js/ui-helpers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.requireTeacher();

      let remoteEvents = [];   // fetched from Apps Script
      let syncStatus = 'idle'; // 'idle' | 'syncing' | 'ok' | 'error'
      let lastSyncMsg = '';

      /* ---------- Profile helpers ---------- */

      let profileCache = null;

      function loadProfiles() {
        if (profileCache) return profileCache;
        const map = new Map();
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && key.startsWith('physci_profile_')) {
            try {
              const p = JSON.parse(localStorage.getItem(key));
              if (p && p.lrn) map.set(String(p.lrn), p);
            } catch (e) { /* ignore */ }
          }
        }
        profileCache = map;
        return map;
      }

      function invalidateProfileCache() { profileCache = null; }

      // Resolve the display name for an event.
      // Priority: name on the event itself > local profile lookup.
      function resolveName(lrn, event) {
        if (event && (event.firstName || event.lastName || event.LastName || event.FirstName)) {
          const last = String(event.lastName || event.LastName || '').trim();
          const first = String(event.firstName || event.FirstName || '').trim();
          if (last && first) return `${last}, ${first}`;
          if (last || first) return last || first;
        }
        if (!lrn) return '';
        const p = loadProfiles().get(String(lrn));
        if (!p) return '';
        const last = (p.lastName || '').trim();
        const first = (p.firstName || '').trim();
        if (last && first) return `${last}, ${first}`;
        return last || first || '';
      }

      function searchableText(lrn, event) {
        return `${resolveName(lrn, event)} ${lrn || ''}`.toLowerCase();
      }

      /* ---------- Merge local + remote events ---------- */

      function getAllEvents() {
        const local = ActivityTracker.getEvents();

        // Dedupe by (timestamp + lrn + action). Remote wins on conflict.
        const seen = new Map();
        [...local, ...remoteEvents].forEach(ev => {
          const key = `${ev.timestamp}|${ev.lrn}|${ev.action}|${ev.week || ''}|${ev.day || ''}|${ev.assessmentId || ''}`;
          // If remote has it, prefer remote (it may carry the name)
          if (!seen.has(key)) {
            seen.set(key, ev);
          } else {
            const existing = seen.get(key);
            const merged = Object.assign({}, existing, ev);
            // Prefer whichever has a non-empty firstName
            if (!merged.firstName && existing.firstName) merged.firstName = existing.firstName;
            if (!merged.lastName && existing.lastName) merged.lastName = existing.lastName;
            seen.set(key, merged);
          }
        });

        return [...seen.values()].sort((a, b) =>
          String(a.timestamp).localeCompare(String(b.timestamp))
        );
      }

      /* ---------- Populate the Student dropdown ---------- */

      function populateStudentDropdown(events) {
        const sel = document.getElementById('filter-student');
        const current = sel.value;

        const lrnsInEvents = new Set(events.map(e => String(e.lrn || '')).filter(Boolean));
        const allLrns = new Set([...lrnsInEvents, ...loadProfiles().keys()]);

        const items = [...allLrns].map(lrn => {
          const nameFromEvent = events.find(e => String(e.lrn) === lrn && (e.firstName || e.lastName));
          const name = resolveName(lrn, nameFromEvent);
          return { lrn, name };
        });

        items.sort((a, b) => {
          const an = a.name || '~';
          const bn = b.name || '~';
          if (an !== bn) return an.localeCompare(bn);
          return a.lrn.localeCompare(b.lrn);
        });

        sel.innerHTML = '<option value="">— All Students —</option>' +
          items.map(it => {
            const label = it.name ? `${it.name} · ${it.lrn}` : `(unnamed) · ${it.lrn}`;
            return `<option value="${it.lrn}">${UI.escapeHtml(label)}</option>`;
          }).join('');

        if (current && [...sel.options].some(o => o.value === current)) {
          sel.value = current;
        }
      }

      /* ---------- Render ---------- */

      function render() {
        invalidateProfileCache();

        const actionFilter  = document.getElementById('filter-action').value;
        const studentFilter = document.getElementById('filter-student').value;
        const searchFilter  = document.getElementById('filter-lrn').value.trim().toLowerCase();

        const allEvents = getAllEvents();

        populateStudentDropdown(allEvents);

        let events = allEvents.slice();
        if (actionFilter)  events = events.filter(e => e.action === actionFilter);
        if (studentFilter) events = events.filter(e => String(e.lrn || '') === studentFilter);
        if (searchFilter)  events = events.filter(e => searchableText(e.lrn, e).includes(searchFilter));

        // Newest first
        events = events.slice().reverse();

        // Stats computed on ALL events, not the filtered set
        const total = allEvents.length;
        const logins = allEvents.filter(e => e.action === 'student_login').length;
        const submissions = allEvents.filter(e => e.action === 'assessment_submit').length;
        const uniqueLrns = new Set(allEvents.map(e => e.lrn).filter(Boolean)).size;
        const namedStudents = new Set(
          allEvents
            .map(e => String(e.lrn || ''))
            .filter(lrn => lrn && resolveName(lrn, allEvents.find(x => String(x.lrn) === lrn)))
        ).size;

        document.getElementById('stats').innerHTML = `
          <div class="cr-stat-card blue">
            <div class="cs-icon">📊</div>
            <div class="cs-value">${total}</div>
            <div class="cs-label">Total Events</div>
          </div>
          <div class="cr-stat-card green">
            <div class="cs-icon">👥</div>
            <div class="cs-value">${uniqueLrns}</div>
            <div class="cs-label">Unique Students</div>
          </div>
          <div class="cr-stat-card amber">
            <div class="cs-icon">🔐</div>
            <div class="cs-value">${logins}</div>
            <div class="cs-label">Logins</div>
          </div>
          <div class="cr-stat-card">
            <div class="cs-icon">📝</div>
            <div class="cs-value">${submissions}</div>
            <div class="cs-label">Submissions</div>
          </div>
        `;

        let countLine = `${events.length} event${events.length === 1 ? '' : 's'}`;
        if (namedStudents) countLine += ` · ${namedStudents} named`;
        if (syncStatus === 'syncing') countLine += ' · ⟳ syncing…';
        if (syncStatus === 'ok')      countLine += ` · ✓ synced (${remoteEvents.length} remote)`;
        if (syncStatus === 'error')   countLine += ` · ⚠ sync failed`;
        document.getElementById('event-count').textContent = countLine;

        if (!events.length) {
          document.getElementById('events-table').innerHTML =
            `<div class="empty-state">No activity matches your filters.</div>`;
          return;
        }

        document.getElementById('events-table').innerHTML = `
          <div class="modern-table-wrap">
            <table class="modern-table">
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Student</th>
                  <th>LRN</th>
                  <th>Action</th>
                  <th>Details</th>
                </tr>
              </thead>
              <tbody>
                ${events.slice(0, 200).map(e => {
                  const name = resolveName(e.lrn, e);
                  const nameCell = name ? UI.escapeHtml(name) : '<span class="text-muted">—</span>';
                  return `
                    <tr>
                      <td>${UI.formatDate(e.timestamp)}</td>
                      <td><strong>${nameCell}</strong></td>
                      <td><code style="font-size:0.8rem;">${UI.escapeHtml(e.lrn || '—')}</code></td>
                      <td>${UI.badge(e.action || '—', 'badge-info')}</td>
                      <td>${UI.escapeHtml(details(e))}</td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function details(e) {
        if (e.action === 'day_complete')      return `Week ${e.week} Day ${e.day} (${e.code || ''})`;
        if (e.action === 'lesson_view')       return `Week ${e.week} Day ${e.day}`;
        if (e.action === 'assessment_start')  return e.assessmentId;
        if (e.action === 'assessment_submit') return `${e.assessmentId} · ${e.score}/${e.total} (${e.percent}%)`;
        if (e.action === 'student_login')     return 'Signed in';
        return '';
      }

      /* ---------- Sync with Apps Script ---------- */

      async function syncFromBackend() {
        syncStatus = 'syncing';
        render();

        const token = (window.Store && typeof Store.getTeacherToken === 'function')
          ? Store.getTeacherToken()
          : (localStorage.getItem('physci_teacher_token') || sessionStorage.getItem('physci_teacher_token') || '');

        try {
          const events = await ActivityTracker.fetchRemoteEvents(token);
          remoteEvents = events;
          syncStatus = 'ok';
        } catch (e) {
          console.warn('Sync failed:', e);
          syncStatus = 'error';
        }
        render();
      }

      /* ---------- Wire up ---------- */

      document.getElementById('filter-action').addEventListener('change', render);
      document.getElementById('filter-student').addEventListener('change', render);
      document.getElementById('filter-lrn').addEventListener('input', render);

      document.getElementById('btn-refresh').addEventListener('click', () => {
        syncFromBackend();
      });

      document.getElementById('btn-clear').addEventListener('click', () => {
        if (confirm('Clear LOCAL activity logs on this device? Remote logs are not affected.')) {
          ActivityTracker.clear();
          invalidateProfileCache();
          render();
        }
      });

      // Initial render, then kick off a background sync
      render();
      syncFromBackend();
    });
  </script>
</body>
</html>
