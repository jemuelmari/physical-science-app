<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locked Assessments · Teacher</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/teacher.css" />
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>🔒 Locked Assessments</h1>
        <span class="version">Physical Science · Teacher</span>
      </div>
      <div class="header-actions">
        <a href="../instructor.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Hub</a>
        <button class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;" data-action="logout-teacher">⏻ Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:1000px;">

    <div class="hero-card" style="margin-bottom:24px;">
      <h2>🔐 Access Control</h2>
      <p class="text-muted">
        View gating rules for each assessment, generate access codes, and review locked status across the class.
      </p>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">Gating Rules</div>
      </div>
      <div id="gating-rules"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header">
        <div class="card-title">🎫 Generate Access Code</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Student LRN</label>
          <input type="text" id="code-lrn" class="form-control" placeholder="12-digit LRN" />
        </div>
        <div class="form-group">
          <label class="form-label">Assessment</label>
          <select id="code-assessment" class="form-control"></select>
        </div>
      </div>
      <button id="btn-gen-code" class="btn btn-primary">🎫 Generate Code</button>
      <div id="code-output" style="margin-top:16px;"></div>
    </div>

    <div class="card" style="margin-top:16px;">
      <div class="card-header">
        <div class="card-title">📋 Codes Issued (Local)</div>
      </div>
      <div id="codes-list"></div>
    </div>

  </main>

  <footer class="app-footer"><p>Locked Assessments · v1.0.0</p></footer>

  <script src="../config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/security.js"></script>
  <script src="../assets/js/sync.js"></script>
  <script src="../assets/js/ui-helpers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      App.requireTeacher();
      await App.loadRegistry();

      const assessments = App.getAssessments();
      const gating = App.getRegistry().gating || {};

      // ---- Gating rules ----
      document.getElementById('gating-rules').innerHTML = `
        <div class="modern-table-wrap">
          <table class="modern-table">
            <thead>
              <tr>
                <th>Assessment</th>
                <th>Type</th>
                <th>Requires</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${assessments.map(a => {
                const req = gating[a.id];
                return `
                  <tr>
                    <td>${UI.escapeHtml(a.title)}</td>
                    <td>${UI.escapeHtml(a.type)}</td>
                    <td>${req && req.requiresWeek ? `Week ${req.requiresWeek}` : '—'}</td>
                    <td>${req && req.requiresWeek
                      ? `<span class="badge badge-warning">🔒 Locked</span>`
                      : `<span class="badge badge-success">✔ Open</span>`}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;

      // ---- Populate assessment selector ----
      const sel = document.getElementById('code-assessment');
      assessments.forEach(a => {
        const opt = document.createElement('option');
        opt.value = a.id;
        opt.textContent = a.title;
        sel.appendChild(opt);
      });

      // ---- Generate code ----
      document.getElementById('btn-gen-code').addEventListener('click', async () => {
        const lrn = document.getElementById('code-lrn').value.trim();
        const assessmentId = sel.value;

        if (!/^\d{12}$/.test(lrn)) {
          alert('Please enter a valid 12-digit LRN.');
          return;
        }
        if (!assessmentId) {
          alert('Please select an assessment.');
          return;
        }

        // Generate locally
        const code = generateCode(8);
        const entry = {
          code,
          lrn,
          assessmentId,
          createdAt: new Date().toISOString(),
          expiresAt: new Date(Date.now() + 24 * 3600 * 1000).toISOString(),
          used: false
        };
        Store.saveCode(entry);

        // Optionally push to backend
        if (Sync.isEnabled()) {
          try {
            await Sync.push({
              lrn, subject: 'physci', type: 'code',
              assessmentId, score: 0, total: 0, percent: 0,
              finalGrade: 0, passed: false, timeSpent: 0,
              answers: { code }, breakdown: []
            });
          } catch (e) { /* non-blocking */ }
        }

        document.getElementById('code-output').innerHTML = `
          <div class="alert alert-success">
            <div style="font-size:0.8rem;text-transform:uppercase;letter-spacing:0.5px;">Access Code</div>
            <div style="font-family:monospace;font-size:1.6rem;font-weight:800;letter-spacing:3px;margin:4px 0;">${code}</div>
            <div style="font-size:0.8rem;">Valid for 24 hours · LRN ${UI.escapeHtml(lrn)}</div>
          </div>
        `;

        renderCodes();
      });

      function renderCodes() {
        const codes = Store.getCodes();
        if (!codes.length) {
          document.getElementById('codes-list').innerHTML =
            `<div class="empty-state">No codes issued yet.</div>`;
          return;
        }
        const sorted = codes.slice().reverse();
        document.getElementById('codes-list').innerHTML = `
          <div class="modern-table-wrap">
            <table class="modern-table">
              <thead>
                <tr>
                  <th>Code</th>
                  <th>LRN</th>
                  <th>Assessment</th>
                  <th>Created</th>
                  <th>Expires</th>
                </tr>
              </thead>
              <tbody>
                ${sorted.map(c => `
                  <tr>
                    <td style="font-family:monospace;font-weight:700;letter-spacing:2px;">${UI.escapeHtml(c.code)}</td>
                    <td>${UI.escapeHtml(c.lrn)}</td>
                    <td>${UI.escapeHtml(c.assessmentId)}</td>
                    <td>${UI.formatDate(c.createdAt)}</td>
                    <td>${UI.formatDate(c.expiresAt)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function generateCode(len) {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        let out = '';
        for (let i = 0; i < len; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
        return out;
      }

      renderCodes();
    });
  </script>
</body>
</html>
