<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Login · Physical Science</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/teacher.css" />
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-hero teacher-login-hero">
        <div class="login-icon">👩‍🏫</div>
        <h1>Teacher Portal</h1>
        <p class="login-subtitle">Physical Science</p>
      </div>

      <form id="teacher-login-form" class="login-form" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="teacherName">Teacher Name</label>
          <input
            type="text"
            id="teacherName"
            name="teacherName"
            class="form-control"
            placeholder="e.g. Ms. Reyes"
            required />
        </div>

        <div class="form-group">
          <label class="form-label" for="token">Access Token</label>
          <input
            type="password"
            id="token"
            name="token"
            class="form-control"
            placeholder="Enter your teacher access token"
            required />
          <div class="form-hint">Contact your department head if you don't have a token.</div>
        </div>

        <div id="teacher-error" class="alert alert-danger hidden" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-full">
          🔐 Sign In
        </button>

      </form>

      <div class="login-footer">
        <a href="index.html">← Back to Home</a>
        <span class="divider">·</span>
        <a href="student/login.html">Student Login →</a>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/security.js"></script>
  <script src="assets/js/teacher-auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, redirect to hub
      if (Store.getTeacher()) {
        window.location.href = 'instructor.html';
        return;
      }

      const form = document.getElementById('teacher-login-form');
      const errEl = document.getElementById('teacher-error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.classList.add('hidden');

        const name = document.getElementById('teacherName').value.trim();
        const token = document.getElementById('token').value.trim();

        if (!name || !token) {
          errEl.textContent = '⚠️ Please fill in all fields.';
          errEl.classList.remove('hidden');
          return;
        }

        try {
          const ok = await TeacherAuth.verify(token);
          if (!ok) {
            errEl.textContent = '⚠️ Invalid access token. Please try again.';
            errEl.classList.remove('hidden');
            return;
          }

          TeacherAuth.save({
            name: name,
            token: token,
            loggedInAt: new Date().toISOString()
          });

          window.location.href = 'instructor.html';
        } catch (err) {
          errEl.textContent = '⚠️ Login failed: ' + err.message;
          errEl.classList.remove('hidden');
        }
      });
    });
  </script>
</body>
</html>
