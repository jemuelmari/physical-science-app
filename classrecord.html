<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Record · Physical Science</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <link rel="stylesheet" href="assets/css/teacher.css" />
  <link rel="stylesheet" href="assets/css/classrecord.css" />
</head>
<body>

  <header class="app-header teacher-header classrecord-header">
    <div class="container flex-between">
      <div>
        <h1>📊 Class Record</h1>
        <span class="version">Physical Science · Teacher</span>
      </div>
      <div class="header-actions">
        <a href="instructor.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Hub</a>
        <a href="classrecord/grading-sheet.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">📄 Grading Sheet</a>
        <button class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;" data-action="logout-teacher">⏻ Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:1300px;">

    <!-- HERO -->
    <div class="classrecord-hero">
      <div class="classrecord-hero-content">
        <div>
          <h1>Class Record</h1>
          <div class="subtitle" id="cr-subtitle">Physical Science · Grade 11/12</div>
        </div>
        <div id="cr-hero-stats" style="display:flex;gap:24px;flex-wrap:wrap;"></div>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <div class="filter-group">
        <label>Section</label>
        <select id="filter-section"><option value="">— All —</option></select>
      </div>
      <div class="filter-group">
        <label>Grade</label>
        <select id="filter-grade">
          <option value="">— All —</option>
          <option value="11">11</option>
          <option value="12">12</option>
        </select>
      </div>
      <div class="filter-actions">
        <button id="btn-refresh" class="btn btn-primary">🔄 Refresh</button>
        <button id="btn-export-csv" class="btn btn-outline">⬇ Export CSV</button>
        <button id="btn-print" class="btn btn-outline">🖨 Print</button>
      </div>
    </div>

    <!-- STATS -->
    <div class="cr-stats-grid" id="cr-stats"></div>

    <!-- GRADEBOOK -->
    <div class="gradebook-wrapper" style="margin-top:24px;">
      <div class="gradebook-scroll">
        <div id="gradebook"></div>
      </div>
    </div>

  </main>

  <footer class="app-footer"><p>Class Record · v1.0.0</p></footer>

  <script src="config.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/transmutation.js"></script>
  <script src="assets/js/ui-helpers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      App.requireTeacher();
      await App.loadRegistry();

      const assessments = App.getAssessments();

      // Populate section filter
      const sectionSel = document.getElementById('filter-section');
      const sections = new Set();
      Store.getRecords().forEach(r => { if (r.section) sections.add(r.section); });
      [...sections].sort().forEach(s => {
        const opt = document.createElement('option');
        opt.value = s; opt.textContent = s;
        sectionSel.appendChild(opt);
      });

      function render() {
        const secFilter = sectionSel.value;
        const grdFilter = document.getElementById('filter-grade').value;

        // Build student map
        const studentsMap = new Map();
        Store.getRecords().forEach(r => {
          const key = r.lrn || 'unknown';
          if (!studentsMap.has(key)) {
            studentsMap.set(key, {
              lrn: key,
              lastName: r.lastName || '',
              firstName: r.firstName || '',
              gradeLevel: r.gradeLevel || '',
              section: r.section || '',
              scores: {}
            });
          }
          studentsMap.get(key).scores[r.assessmentId] = r;
        });

        let students = Array.from(studentsMap.values());
        if (secFilter) students = students.filter(s => s.section === secFilter);
        if (grdFilter) students = students.filter(s => String(s.gradeLevel) === grdFilter);
        students.sort((a, b) =>
          (a.lastName || '').localeCompare(b.lastName || '') ||
          (a.firstName || '').localeCompare(b.firstName || '')
        );

        // Hero stats
        const allRecords = Store.getRecords();
        const classAvg = allRecords.length
          ? Math.round(allRecords.reduce((s, r) => s + (Number(r.finalGrade) || 0), 0) / allRecords.length)
          : 0;
        const passed = allRecords.filter(r => r.passed).length;
        const passRate = allRecords.length ? Math.round((passed / allRecords.length) * 100) : 0;

        document.getElementById('cr-hero-stats').innerHTML = `
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:800;">${students.length}</div>
            <div style="font-size:0.7rem;opacity:0.9;text-transform:uppercase;letter-spacing:0.5px;">Students</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:800;">${allRecords.length}</div>
            <div style="font-size:0.7rem;opacity:0.9;text-transform:uppercase;letter-spacing:0.5px;">Records</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:800;">${allRecords.length ? classAvg : '—'}</div>
            <div style="font-size:0.7rem;opacity:0.9;text-transform:uppercase;letter-spacing:0.5px;">Avg Grade</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:1.6rem;font-weight:800;">${passRate}%</div>
            <div style="font-size:0.7rem;opacity:0.9;text-transform:uppercase;letter-spacing:0.5px;">Passing</div>
          </div>
        `;

        // Stats cards
        const avgByAssessment = {};
        assessments.forEach(a => {
          const recs = allRecords.filter(r => r.assessmentId === a.id);
          avgByAssessment[a.id] = recs.length
            ? Math.round(recs.reduce((s, r) => s + (Number(r.finalGrade) || 0), 0) / recs.length)
            : null;
        });

        document.getElementById('cr-stats').innerHTML = `
          <div class="cr-stat-card blue">
            <div class="cs-icon">👥</div>
            <div class="cs-value">${students.length}</div>
            <div class="cs-label">Filtered Students</div>
          </div>
          <div class="cr-stat-card ${classAvg >= 75 ? 'green' : 'red'}">
            <div class="cs-icon">🎯</div>
            <div class="cs-value">${allRecords.length ? classAvg : '—'}</div>
            <div class="cs-label">Class Average</div>
          </div>
          <div class="cr-stat-card amber">
            <div class="cs-icon">✅</div>
            <div class="cs-value">${passRate}%</div>
            <div class="cs-label">Passing Rate</div>
          </div>
          <div class="cr-stat-card">
            <div class="cs-icon">📋</div>
            <div class="cs-value">${assessments.length}</div>
            <div class="cs-label">Assessments</div>
          </div>
        `;

        // Gradebook
        if (!students.length) {
          document.getElementById('gradebook').innerHTML =
            `<div class="empty-state" style="padding:32px;text-align:center;">No students to display. Adjust filters or wait for records.</div>`;
          return;
        }

        document.getElementById('gradebook').innerHTML = `
          <table class="gradebook-table">
            <thead>
              <tr>
                <th>Student</th>
                <th>Grade</th>
                <th>Section</th>
                ${assessments.map(a => `<th>${shortTitle(a.id)}</th>`).join('')}
                <th>Average</th>
                <th>Transmuted</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody>
              ${students.map(s => {
                const grades = assessments.map(a => {
                  const rec = s.scores[a.id];
                  return rec ? Number(rec.finalGrade) : null;
                });
                const valid = grades.filter(g => g != null);
                const avg = valid.length ? Math.round(valid.reduce((x, y) => x + y, 0) / valid.length) : null;
                const transmuted = avg != null ? Transmutation.apply(avg) : null;
                const passed = transmuted != null && transmuted >= 75;

                return `
                  <tr>
                    <td class="student-cell">
                      <div class="student-info">
                        <div class="name">${UI.escapeHtml(s.lastName)}, ${UI.escapeHtml(s.firstName)}</div>
                        <div class="meta">${UI.escapeHtml(s.lrn)}</div>
                      </div>
                    </td>
                    <td>${UI.escapeHtml(s.gradeLevel)}</td>
                    <td>${UI.escapeHtml(s.section)}</td>
                    ${grades.map(g => g != null
                      ? `<td class="grade-cell">${g}</td>`
                      : `<td class="empty-cell">—</td>`
                    ).join('')}
                    <td class="final-grade">${avg != null ? avg : '—'}</td>
                    <td class="final-grade ${passed ? 'passing' : 'failing'}">${transmuted != null ? transmuted : '—'}</td>
                    <td>
                      ${transmuted != null
                        ? `<span class="status-badge ${passed ? 'pass' : 'fail'}">${passed ? '✓' : '✗'}</span>`
                        : `<span class="status-badge">—</span>`}
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
      }

      function shortTitle(id) {
        const a = App.getAssessment(id);
        if (!a) return id;
        if (a.type === 'quiz') return 'Q' + id.replace('physci-quiz', '');
        if (a.type === 'summative') return 'ST' + id.replace('physci-st', '');
        if (a.type === 'term') return 'TE';
        if (a.type === 'performance') return 'PT';
        return id;
      }

      document.getElementById('filter-section').addEventListener('change', render);
      document.getElementById('filter-grade').addEventListener('change', render);
      document.getElementById('btn-refresh').addEventListener('click', render);

      document.getElementById('btn-export-csv').addEventListener('click', () => {
        const rows = [
          ['LRN', 'LastName', 'FirstName', 'GradeLevel', 'Section',
           ...assessments.map(a => shortTitle(a.id)),
           'Average', 'Transmuted', 'Status']
        ];
        const allRecords = Store.getRecords();
        const studentsMap = new Map();
        allRecords.forEach(r => {
          const key = r.lrn;
          if (!studentsMap.has(key)) studentsMap.set(key, { lrn: key, lastName: r.lastName, firstName: r.firstName, gradeLevel: r.gradeLevel, section: r.section, scores: {} });
          studentsMap.get(key).scores[r.assessmentId] = r;
        });

        Array.from(studentsMap.values()).forEach(s => {
          const grades = assessments.map(a => s.scores[a.id] ? s.scores[a.id].finalGrade : '');
          const valid = grades.filter(g => g !== '');
          const avg = valid.length ? Math.round(valid.reduce((x, y) => x + y, 0) / valid.length) : '';
          const transmuted = avg !== '' ? Transmutation.apply(avg) : '';
          rows.push([
            s.lrn, s.lastName, s.firstName, s.gradeLevel, s.section,
            ...grades, avg, transmuted, transmuted !== '' && transmuted >= 75 ? 'PASSED' : 'FAILED'
          ]);
        });

        const csv = rows.map(row => row.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `physci-class-record-${Date.now()}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('btn-print').addEventListener('click', () => window.print());

      render();
    });
  </script>
</body>
</html>
