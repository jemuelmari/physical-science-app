<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · Physical Science</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/student.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>👤 My Profile</h1>
        <span class="version">Physical Science</span>
      </div>
      <div class="header-actions">
        <a href="dashboard.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Dashboard</a>
        <button class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;" data-action="logout-student">⏻ Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:820px;">

    <!-- PROFILE CARD -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">Student Information</div>
      </div>
      <form id="profile-form">
        <div class="form-group">
          <label class="form-label">LRN</label>
          <input type="text" id="lrn" class="form-control" disabled />
          <div class="form-hint">LRN cannot be changed.</div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" id="lastName" class="form-control" required />
          </div>
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" id="firstName" class="form-control" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Grade Level</label>
            <select id="gradeLevel" class="form-control" required>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Section</label>
            <input type="text" id="section" class="form-control" required />
          </div>
        </div>
        <div id="profile-msg" class="alert hidden" role="alert"></div>
        <button type="submit" class="btn btn-primary">💾 Save Changes</button>
      </form>
    </div>

    <!-- RECORDS -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📊 All My Scores</div>
      </div>
      <div id="records-table"></div>
    </div>

    <!-- BACKUP -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">🔐 Backup & Restore</div>
      </div>
      <p class="text-muted text-small">
        Download a copy of your local records for safekeeping, or restore from a previous backup.
      </p>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;">
        <button id="btn-export" class="btn btn-outline">⬇ Export Records (JSON)</button>
        <button id="btn-import" class="btn btn-outline">⬆ Import Records</button>
        <input type="file" id="file-import" accept="application/json" class="hidden" />
      </div>
    </div>

  </main>

  <footer class="app-footer">
    <p>Physical Science · Profile · v1.0.0</p>
  </footer>

  <script src="../config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/ui-helpers.js"></script>
  <script src="profile.js"></script>
</body>
</html>
