<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login · Physical Science</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/student.css" />
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-hero">
        <div class="login-icon">🔬</div>
        <h1>Physical Science</h1>
        <p class="login-subtitle">Student Portal</p>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="lrn">LRN (12 digits)</label>
          <input
            type="text"
            id="lrn"
            name="lrn"
            class="form-control"
            inputmode="numeric"
            pattern="\d{12}"
            maxlength="12"
            placeholder="e.g. 123456789012"
            required />
          <div class="form-hint">Enter your Learner Reference Number.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="lastName">Last Name</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            class="form-control"
            placeholder="e.g. Dela Cruz"
            required />
        </div>

        <div class="form-group">
          <label class="form-label" for="firstName">First Name</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            class="form-control"
            placeholder="e.g. Juan"
            required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="gradeLevel">Grade</label>
            <select id="gradeLevel" name="gradeLevel" class="form-control" required>
              <option value="">— Select —</option>
              <option value="11">11</option>
              <option value="12">12</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="section">Section</label>
            <input
              type="text"
              id="section"
              name="section"
              class="form-control"
              placeholder="e.g. STEM-A"
              required />
          </div>
        </div>

        <div id="login-error" class="alert alert-danger hidden" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-full">
          ▶ Enter Portal
        </button>

      </form>

      <div class="login-footer">
        <a href="../index.html">← Back to Home</a>
        <span class="divider">·</span>
        <a href="../teacher-login.html">Teacher Login →</a>
      </div>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, go to dashboard
      const existing = Store.getStudent();
      if (existing && existing.lrn) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const errEl = document.getElementById('login-error');

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errEl.classList.add('hidden');

        const data = {
          lrn: document.getElementById('lrn').value.trim(),
          lastName: document.getElementById('lastName').value.trim(),
          firstName: document.getElementById('firstName').value.trim(),
          gradeLevel: document.getElementById('gradeLevel').value,
          section: document.getElementById('section').value.trim(),
          loggedInAt: new Date().toISOString()
        };

        // Validate
        if (!/^\d{12}$/.test(data.lrn)) {
          errEl.textContent = '⚠️ LRN must be exactly 12 digits.';
          errEl.classList.remove('hidden');
          return;
        }
        if (!data.lastName || !data.firstName) {
          errEl.textContent = '⚠️ Please enter your full name.';
          errEl.classList.remove('hidden');
          return;
        }
        if (!data.gradeLevel || !data.section) {
          errEl.textContent = '⚠️ Please enter your grade and section.';
          errEl.classList.remove('hidden');
          return;
        }

        // Save and redirect
        Store.setStudent(data);

        if (window.ActivityTracker) {
          ActivityTracker.log({ action: 'student_login', lrn: data.lrn });
        }

        window.location.href = 'dashboard.html';
      });
    });
  </script>
</body>
</html>
