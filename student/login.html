<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login · Physical Science</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/student.css" />
</head>
<body class="login-page">

  <div class="login-wrapper">
    <div class="login-card" style="max-width:520px;">

      <div class="login-hero">
        <div class="login-icon">🔬</div>
        <h1>Student Login</h1>
        <p class="login-subtitle">Physical Science · Create Your Profile</p>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">

        <!-- LAST NAME -->
        <div class="form-group">
          <label class="form-label" for="lastName">Last Name <span style="color:#c62828;">*</span></label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            class="form-control"
            placeholder="DELA CRUZ"
            style="text-transform:uppercase;"
            required />
          <div class="form-hint">Will be saved in ALL CAPS</div>
        </div>

        <!-- FIRST NAME -->
        <div class="form-group">
          <label class="form-label" for="firstName">First Name <span style="color:#c62828;">*</span></label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            class="form-control"
            placeholder="Juan"
            required />
          <div class="form-hint">Will be saved in Title Case</div>
        </div>

        <!-- MIDDLE NAME -->
        <div class="form-group">
          <label class="form-label" for="middleName">Middle Name</label>
          <input
            type="text"
            id="middleName"
            name="middleName"
            class="form-control"
            placeholder="Santos" />
          <div class="form-hint">Optional · Title Case</div>
        </div>

        <!-- SEX -->
        <div class="form-group">
          <label class="form-label" for="sex">Sex <span style="color:#c62828;">*</span></label>
          <select id="sex" name="sex" class="form-control" required>
            <option value="">— Select —</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>

        <!-- LRN -->
        <div class="form-group">
          <label class="form-label" for="lrn">LRN (12 digits) <span style="color:#c62828;">*</span></label>
          <input
            type="text"
            id="lrn"
            name="lrn"
            class="form-control"
            inputmode="numeric"
            pattern="\d{12}"
            maxlength="12"
            placeholder="1234-5678-9012"
            required />
          <div class="form-hint">Exactly 12 digits, numeric only</div>
        </div>

        <!-- GRADE LEVEL -->
        <div class="form-group">
          <label class="form-label" for="gradeLevel">Grade Level <span style="color:#c62828;">*</span></label>
          <select id="gradeLevel" name="gradeLevel" class="form-control" required>
            <option value="">— Select —</option>
            <option value="11">Grade 11</option>
            <option value="12">Grade 12</option>
          </select>
        </div>

        <!-- SECTION -->
        <div class="form-group">
          <label class="form-label" for="section">Section <span style="color:#c62828;">*</span></label>
          <select id="section" name="section" class="form-control" required>
            <option value="">— Select —</option>
            <option value="GAS">GAS</option>
            <option value="HUMMS">HUMMS</option>
            <option value="ACADEMIC A">ACADEMIC A</option>
            <option value="ACADEMIC B">ACADEMIC B</option>
          </select>
        </div>

        <!-- CONSENT -->
        <div class="form-group">
          <label class="consent-row">
            <input type="checkbox" id="consent" name="consent" required />
            <span>
              I agree that my progress may be saved locally on this device and
              shared with my teacher via sync code or backup file.
            </span>
          </label>
        </div>

        <div id="login-error" class="alert alert-danger hidden" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-full">
          Create Profile →
        </button>

      </form>

      <div class="login-footer">
        <a href="../index.html">← Back to Home</a>
        <span class="divider">·</span>
        <a href="../teacher-login.html">Teacher Login →</a>
      </div>

    </div>
  </div>

  <script src="../config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // If already logged in, go to dashboard
      const existing = Store.getStudent();
      if (existing && existing.lrn) {
        window.location.href = 'dashboard.html';
        return;
      }

      const form = document.getElementById('login-form');
      const errEl = document.getElementById('login-error');
      const lrnEl = document.getElementById('lrn');

      // Auto-format LRN with dashes as the student types
      lrnEl.addEventListener('input', () => {
        const digits = lrnEl.value.replace(/\D/g, '').slice(0, 12);
        let formatted = digits;
        if (digits.length > 8) {
          formatted = digits.slice(0, 4) + '-' + digits.slice(4, 8) + '-' + digits.slice(8);
        } else if (digits.length > 4) {
          formatted = digits.slice(0, 4) + '-' + digits.slice(4);
        }
        lrnEl.value = formatted;
      });

      // Title Case helper
      function titleCase(str) {
        return String(str || '')
          .trim()
          .replace(/\s+/g, ' ')
          .toLowerCase()
          .split(' ')
          .map(w => w.charAt(0).toUpperCase() + w.slice(1))
          .join(' ');
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        errEl.classList.add('hidden');

        const rawLrn = document.getElementById('lrn').value.replace(/\D/g, '');
        const data = {
          lastName:   document.getElementById('lastName').value.trim().toUpperCase(),
          firstName:  titleCase(document.getElementById('firstName').value),
          middleName: titleCase(document.getElementById('middleName').value),
          sex:        document.getElementById('sex').value,
          lrn:        rawLrn,
          gradeLevel: document.getElementById('gradeLevel').value,
          section:    document.getElementById('section').value,
          consent:    document.getElementById('consent').checked,
          loggedInAt: new Date().toISOString()
        };

        // ---- Validate ----
        if (!data.lastName || !data.firstName) {
          return showError('⚠️ Please enter your full name.');
        }
        if (!data.sex) {
          return showError('⚠️ Please select your sex.');
        }
        if (!/^\d{12}$/.test(data.lrn)) {
          return showError('⚠️ LRN must be exactly 12 digits.');
        }
        if (!data.gradeLevel) {
          return showError('⚠️ Please select your grade level.');
        }
        if (!data.section) {
          return showError('⚠️ Please select your section.');
        }
        if (!data.consent) {
          return showError('⚠️ Please check the consent box to continue.');
        }

        // ---- Save & redirect ----
        Store.setStudent(data);

        if (window.ActivityTracker) {
          ActivityTracker.log({
            action: 'student_login',
            lrn: data.lrn,
            section: data.section,
            gradeLevel: data.gradeLevel
          });
        }

        window.location.href = 'dashboard.html';
      });

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
        window.scrollTo({ top: errEl.offsetTop - 100, behavior: 'smooth' });
      }
    });
  </script>
</body>
</html>
