<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Physical Science</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/student.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>📘 Physical Science</h1>
        <span class="version">Student Dashboard</span>
      </div>
      <div class="header-actions">
        <a href="physci/index.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">📅 Timeline</a>
        <a href="assessments/index.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">📝 Assessments</a>
        <a href="profile.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">👤 Profile</a>
        <button class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;" data-action="logout-student">⏻ Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:1000px;">

    <div id="welcome-card" class="dashboard-welcome"></div>
    <div id="stats-grid" class="dashboard-stats"></div>

    <div class="dashboard-section">
      <h2 class="section-title">📅 Weekly Progress</h2>
      <div id="weeks-grid" class="weeks-grid"></div>
    </div>

    <div class="dashboard-section">
      <h2 class="section-title">📊 Recent Scores</h2>
      <div id="recent-records"></div>
    </div>

    <div class="dashboard-section">
      <h2 class="section-title">⚡ Quick Actions</h2>
      <div class="quick-actions">
        <a class="action-card" href="physci/week1/index.html">
          <div class="action-icon">▶</div>
          <div class="action-title">Continue Learning</div>
          <div class="action-sub">Jump to Week 1</div>
        </a>
        <a class="action-card" href="assessments/index.html">
          <div class="action-icon">📝</div>
          <div class="action-title">Take Assessment</div>
          <div class="action-sub">Quiz, ST, or Term Exam</div>
        </a>
        <a class="action-card" href="physci/index.html">
          <div class="action-icon">🕰️</div>
          <div class="action-title">View Timeline</div>
          <div class="action-sub">10-week journey</div>
        </a>
      </div>
    </div>

  </main>

  <footer class="app-footer">
    <p>Physical Science · Student Portal · v1.0.0</p>
    <div id="dev-credit"></div>
  </footer>

  <script src="../config.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/ui-helpers.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/gamify.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/activity-tracker.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const student = App.requireStudent();
      if (!student) return;

      await App.loadRegistry();

      // ---- WELCOME ----
      const hour = new Date().getHours();
      const greet = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
      document.getElementById('welcome-card').innerHTML = `
        <div class="dashboard-welcome-inner">
          <div class="welcome-avatar ${UI.avatarClass(student.lrn)}">
            ${UI.initials(student.firstName, student.lastName)}
          </div>
          <div>
            <div class="welcome-greet">${greet},</div>
            <div class="welcome-name">${UI.escapeHtml(student.firstName)} ${UI.escapeHtml(student.lastName)}</div>
            <div class="welcome-meta">
              LRN ${UI.escapeHtml(student.lrn)} · Grade ${UI.escapeHtml(student.gradeLevel)} · ${UI.escapeHtml(student.section)}
            </div>
          </div>
        </div>
      `;

      // ---- STATS ----
      const weeks = App.getWeeks();
      const records = Store.getRecordsByStudent(student.lrn);

      let daysCompleted = 0;
      weeks.forEach(w => {
        for (let d = 1; d <= 4; d++) {
          if (Store.isDayComplete(w.n, d)) daysCompleted++;
        }
      });
      const totalDays = weeks.length * 4;
      const progressPct = totalDays > 0 ? Math.round((daysCompleted / totalDays) * 100) : 0;
      const avgGrade = records.length
        ? Math.round(records.reduce((s, r) => s + (Number(r.finalGrade) || 0), 0) / records.length)
        : 0;

      const xp = (window.Gamify) ? Gamify.getXP() : 0;
      const streak = (window.Gamify) ? Gamify.getStreak().count : 0;

      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card">
          <div class="stat-icon">📅</div>
          <div class="stat-value">${daysCompleted} / ${totalDays}</div>
          <div class="stat-label">Days Completed</div>
        </div>
        <div class="stat-card ${progressPct >= 75 ? 'green' : 'amber'}">
          <div class="stat-icon">📈</div>
          <div class="stat-value">${progressPct}%</div>
          <div class="stat-label">Overall Progress</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⚡</div>
          <div class="stat-value">${xp}</div>
          <div class="stat-label">Total XP</div>
        </div>
        <div class="stat-card ${streak >= 3 ? 'green' : ''}">
          <div class="stat-icon">🔥</div>
          <div class="stat-value">${streak}</div>
          <div class="stat-label">Day Streak</div>
        </div>
      `;

      // ---- WEEKS GRID ----
      document.getElementById('weeks-grid').innerHTML = weeks.map(w => {
        const p = Store.getWeekProgress(w.n, 4);
        const color = p.percent >= 100 ? 'green' : p.percent > 0 ? 'amber' : '';
        return `
          <a class="week-progress-card" href="physci/week${w.n}/index.html">
            <div class="week-progress-icon">${w.icon}</div>
            <div class="week-progress-body">
              <div class="week-progress-num">Week ${w.n}</div>
              <div class="week-progress-title">${UI.escapeHtml(w.title)}</div>
              <div class="week-progress-bar">
                <div class="week-progress-fill ${color}" style="width:${p.percent}%;"></div>
              </div>
              <div class="week-progress-meta">${p.done} of ${p.total} days · ${p.percent}%</div>
            </div>
          </a>
        `;
      }).join('');

      // ---- RECENT RECORDS ----
      const recent = records.slice().sort((a, b) =>
        new Date(b.timestamp || b.createdAt || 0) - new Date(a.timestamp || a.createdAt || 0)
      ).slice(0, 5);

      if (!recent.length) {
        document.getElementById('recent-records').innerHTML =
          `<div class="empty-state">No assessments taken yet. Start learning to unlock your first quiz!</div>`;
      } else {
        document.getElementById('recent-records').innerHTML = `
          <div class="modern-table-wrap">
            <table class="modern-table">
              <thead>
                <tr>
                  <th>Assessment</th>
                  <th>Score</th>
                  <th>%</th>
                  <th>Grade</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody>
                ${recent.map(r => `
                  <tr>
                    <td>${UI.escapeHtml(r.title || r.assessmentId)}</td>
                    <td>${r.score} / ${r.total}</td>
                    <td>${r.percent}%</td>
                    <td>${UI.gradeBadge(r.finalGrade)}</td>
                    <td>${UI.formatDate(r.timestamp || r.createdAt)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
