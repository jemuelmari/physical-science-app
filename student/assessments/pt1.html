<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Task 1 · Physical Science</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/student.css" />
  <link rel="stylesheet" href="../../assets/css/quiz.css" />
</head>
<body class="quiz-active">

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>🎨 Performance Task 1</h1>
        <span class="version">v1.0.0</span>
      </div>
      <a href="index.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Assessments</a>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:820px;">
    <div id="quiz-header"></div>
    <div id="quiz-body"></div>
    <div id="quiz-nav" style="margin-top:24px;"></div>
  </main>

  <footer class="app-footer">
    <p>Performance Task 1 · v1.0.0</p>
  </footer>

  <script src="../../config.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/store.js"></script>
  <script src="../../assets/js/security.js"></script>
  <script src="../../assets/js/transmutation.js"></script>
  <script src="../../assets/js/activity-gate.js"></script>
  <script src="../../assets/js/activity-tracker.js"></script>
  <script src="../../assets/js/quiz-engine.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('../../data/physci-pt1.json');
        const data = await res.json();

        QuizEngine.init({
          assessmentId: data.assessmentId,
          subject: data.subject,
          type: data.type,
          title: data.title,
          items: data.items,
          timeLimit: data.timeLimit,
          passingScore: data.passingScore
        });
      } catch (err) {
        console.error('Failed to load assessment:', err);
        document.getElementById('quiz-body').innerHTML =
          `<div class="quiz-alert danger">Failed to load assessment. Please refresh the page.</div>`;
      }
    });
  </script>
</body>
</html>
