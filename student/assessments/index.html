<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessments · Physical Science</title>
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/student.css" />
  <link rel="stylesheet" href="../../assets/css/quiz.css" />
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1>📝 Assessments</h1>
        <span class="version">Physical Science</span>
      </div>
      <div class="header-actions">
        <a href="../dashboard.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Dashboard</a>
        <button class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;" data-action="logout-student">⏻ Logout</button>
      </div>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;max-width:1000px;">

    <div class="hero-card" style="margin-bottom:24px;">
      <h2>📚 Your Assessment Journey</h2>
      <p class="text-muted">
        Complete the weekly lessons to unlock each assessment. Your scores are saved
        automatically and synced when online.
      </p>
    </div>

    <div id="assessments-list" class="assessments-list"></div>

  </main>

  <footer class="app-footer">
    <p>Assessments · v1.0.0</p>
  </footer>

  <script src="../../config.js"></script>
  <script src="../../assets/js/store.js"></script>
  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/security.js"></script>
  <script src="../../assets/js/transmutation.js"></script>
  <script src="../../assets/js/activity-gate.js"></script>
  <script src="../../assets/js/activity-tracker.js"></script>
  <script src="../../assets/js/ui-helpers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const student = App.requireStudent();
      if (!student) return;

      await App.loadRegistry();

      const assessments = App.getAssessments();
      const records = Store.getRecordsByStudent(student.lrn);

      const container = document.getElementById('assessments-list');

      if (!assessments.length) {
        container.innerHTML = `<div class="empty-state">No assessments configured. Check back soon.</div>`;
        return;
      }

      container.innerHTML = assessments.map(a => {
        const status = ActivityGate.getStatus(a.id);
        const record = records.find(r => r.assessmentId === a.id);
        const isLocked = !status.unlocked;
        const isDone = !!record;

        let stateBadge = '';
        if (isDone) {
          stateBadge = `<span class="badge badge-success">✓ Completed · ${record.finalGrade}</span>`;
        } else if (isLocked) {
          stateBadge = `<span class="badge badge-warning">🔒 Locked</span>`;
        } else {
          stateBadge = `<span class="badge badge-info">▶ Available</span>`;
        }

        const href = isLocked ? '#' : a.file;
        const cls = [
          'assessment-card',
          isLocked ? 'locked' : '',
          isDone ? 'completed' : ''
        ].filter(Boolean).join(' ');

        return `
          <a class="${cls}" href="${href}" data-assessment-id="${a.id}">
            <div class="assessment-icon">${typeIcon(a.type)}</div>
            <div class="assessment-body">
              <div class="assessment-title">${UI.escapeHtml(a.title)}</div>
              <div class="assessment-meta">
                <span>${a.items} items</span>
                <span class="dot">·</span>
                <span>${a.time > 0 ? a.time + ' min' : 'No time limit'}</span>
                <span class="dot">·</span>
                <span>Weeks ${UI.escapeHtml(a.weeks)}</span>
              </div>
              ${isLocked && status.reason ? `<div class="assessment-lock-msg">${UI.escapeHtml(status.reason)}</div>` : ''}
            </div>
            <div class="assessment-right">
              ${stateBadge}
            </div>
          </a>
        `;
      }).join('');

      // Lock clicks
      ActivityGate.applyLocks();

      function typeIcon(type) {
        if (type === 'quiz') return '📝';
        if (type === 'summative') return '📊';
        if (type === 'term') return '🎓';
        if (type === 'performance') return '🎨';
        return '📋';
      }
    });
  </script>
</body>
</html>
